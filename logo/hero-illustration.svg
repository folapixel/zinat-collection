<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="creamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e9ea"/>
      <stop offset="100%" stop-color="#e8d0d3"/>
    </linearGradient>
    <linearGradient id="lotionGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fa199c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c90f7d"/>
    </linearGradient>
    <linearGradient id="lipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#865860"/>
      <stop offset="100%" stop-color="#6e4549"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fa199c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#fa199c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#865860" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- soft background glow -->
  <circle cx="250" cy="260" r="200" fill="url(#glow)"/>

  <!-- === Cream Jar === -->
  <g filter="url(#shadow)" transform="translate(130, 160)">
    <!-- jar body -->
    <rect x="0" y="40" width="100" height="90" rx="16" fill="url(#creamGrad)"/>
    <!-- jar lid -->
    <rect x="-4" y="28" width="108" height="20" rx="10" fill="#865860"/>
    <!-- label -->
    <rect x="18" y="62" width="64" height="30" rx="6" fill="#fff" fill-opacity="0.7"/>
    <text x="50" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#865860">CREAM</text>
    <!-- shine -->
    <ellipse cx="28" cy="70" rx="8" ry="18" fill="#fff" fill-opacity="0.25" transform="rotate(-10 28 70)"/>
  </g>

  <!-- === Lotion Bottle === -->
  <g filter="url(#shadow)" transform="translate(270, 110)">
    <!-- bottle body -->
    <rect x="10" y="50" width="60" height="150" rx="14" fill="url(#lotionGrad)"/>
    <!-- bottle neck -->
    <rect x="24" y="30" width="32" height="26" rx="6" fill="#c90f7d"/>
    <!-- pump top -->
    <rect x="20" y="16" width="40" height="18" rx="9" fill="#865860"/>
    <rect x="36" y="6" width="8" height="14" rx="4" fill="#6e4549"/>
    <!-- label -->
    <rect x="18" y="80" width="44" height="40" rx="6" fill="#fff" fill-opacity="0.6"/>
    <text x="40" y="104" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="#c90f7d">LOTION</text>
    <!-- shine -->
    <ellipse cx="26" cy="100" rx="5" ry="30" fill="#fff" fill-opacity="0.2" transform="rotate(-5 26 100)"/>
  </g>

  <!-- === Lipstick === -->
  <g filter="url(#shadow)" transform="translate(90, 310)">
    <!-- base -->
    <rect x="8" y="80" width="36" height="60" rx="8" fill="#6e4549"/>
    <!-- middle band -->
    <rect x="6" y="74" width="40" height="10" rx="3" fill="#865860"/>
    <!-- bullet -->
    <path d="M12 74 L12 30 Q30 10 48 30 L48 74 Z" fill="url(#lipGrad)"/>
    <!-- bullet highlight -->
    <path d="M18 70 L18 35 Q30 18 34 35 L34 70 Z" fill="#fff" fill-opacity="0.15"/>
    <!-- top tip shine -->
    <ellipse cx="30" cy="28" rx="6" ry="4" fill="#fff" fill-opacity="0.2"/>
  </g>

  <!-- === Small Compact / Palette === -->
  <g filter="url(#shadow)" transform="translate(230, 340)">
    <!-- compact base -->
    <rect x="0" y="15" width="90" height="50" rx="12" fill="#f3e9ea"/>
    <!-- compact lid -->
    <rect x="-2" y="0" width="94" height="20" rx="10" fill="#865860"/>
    <!-- decorative dots -->
    <circle cx="22" cy="40" r="8" fill="#fa199c" fill-opacity="0.5"/>
    <circle cx="45" cy="40" r="8" fill="#865860" fill-opacity="0.6"/>
    <circle cx="68" cy="40" r="8" fill="#c90f7d" fill-opacity="0.4"/>
  </g>

  <!-- === Scattered decorative dots === -->
  <circle cx="80" cy="130" r="5" fill="#fa199c" fill-opacity="0.25"/>
  <circle cx="420" cy="180" r="4" fill="#865860" fill-opacity="0.20"/>
  <circle cx="400" cy="320" r="6" fill="#fa199c" fill-opacity="0.18"/>
  <circle cx="100" cy="440" r="4" fill="#c90f7d" fill-opacity="0.22"/>
  <circle cx="380" cy="430" r="3" fill="#865860" fill-opacity="0.25"/>
</svg>
